{% extends "core/base.html" %}
{% block title %}Clothify — Catalog{% endblock %}
{% block body %}

<section class="container mx-auto px-4 mt-10">
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
    <h1 class="text-3xl font-semibold">Catalog</h1>
    <div class="flex gap-2">
      <a href="/catalog/" class="text-sm px-4 py-2 rounded-full border hover:bg-neutral-50">All</a>
      {% for c in categories %}
        <a href="/catalog/?cat={{ c.slug }}" class="text-sm px-4 py-2 rounded-full border hover:bg-neutral-50">{{ c.name }}</a>
      {% endfor %}
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8">
    {% for p in products %}
      <a href="/product/{{ p.slug }}/" class="group">
        <div class="aspect-[4/5] bg-neutral-100 rounded-xl overflow-hidden">
          <div class="w-full h-full bg-gradient-to-br from-neutral-200 to-neutral-100 group-hover:scale-105 transition-transform"></div>
        </div>
        <div class="mt-3">
          <div class="text-sm font-medium">{{ p.name }}</div>
          <div class="text-sm text-neutral-600">₹{{ p.price }}</div>
        </div>
      </a>
    {% empty %}
      <div class="col-span-full text-neutral-500">No products found.</div>
    {% endfor %}
  </div>
</section>

{% endblock %}

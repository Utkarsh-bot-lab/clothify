{% extends "core/base.html" %}
{% block title %}{{ product.name }} — Clothify{% endblock %}
{% block body %}
<section class="container mx-auto px-4 mt-10 grid grid-cols-1 lg:grid-cols-2 gap-10">
  <!-- image -->
  <div class="aspect-[4/5] bg-neutral-100 rounded-2xl"></div>

  <!-- details -->
  <div>
    <h1 class="text-3xl font-semibold">{{ product.name }}</h1>
    <div class="mt-2 text-xl">₹{{ product.price }}</div>
    <p class="mt-6 text-neutral-700 leading-relaxed">{{ product.description }}</p>

    <form class="mt-8">
      <label class="block text-sm mb-2">Size</label>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="px-4 py-2 border rounded-full text-sm hover:bg-neutral-50">S</button>
        <button type="button" class="px-4 py-2 border rounded-full text-sm hover:bg-neutral-50">M</button>
        <button type="button" class="px-4 py-2 border rounded-full text-sm hover:bg-neutral-50">L</button>
        <button type="button" class="px-4 py-2 border rounded-full text-sm hover:bg-neutral-50">XL</button>
      </div>
      <button class="mt-6 w-full bg-black text-white py-3 rounded-full text-sm font-medium hover:opacity-90">Add to bag</button>
    </form>
  </div>
</section>
{% endblock %}

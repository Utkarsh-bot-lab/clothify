<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Clothify{% endblock %}</title>

    <!-- Tailwind (CDN for dev) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      html, body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .container { max-width: 1200px; }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body class="text-neutral-900 bg-white">
    <!-- Top bar -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-neutral-200">
      <div class="container mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/" class="text-2xl tracking-[0.25em] font-semibold">CLOTHIFY</a>
        <nav class="hidden sm:flex items-center gap-8">
          <a href="/catalog/" class="text-sm hover:opacity-70">Shop</a>
          <a href="/catalog/?cat=men" class="text-sm hover:opacity-70">Men</a>
          <a href="/catalog/?cat=women" class="text-sm hover:opacity-70">Women</a>
          <a href="/catalog/?cat=kids" class="text-sm hover:opacity-70">Kids</a>
        </nav>
        <div class="flex items-center gap-4">
          <!-- search -->
          <form action="/catalog/" method="get" class="hidden sm:block">
            <input name="q" placeholder="Search" class="text-sm border border-neutral-300 rounded-full px-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-black/10" />
          </form>
          <!-- icons -->
          <a href="/admin/" title="Admin" class="p-2 rounded-full hover:bg-neutral-100">
            <!-- user icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 19.5a8.25 8.25 0 1115 0v.75H4.5v-.75z"/></svg>
          </a>
          <a href="/catalog/" title="Bag" class="p-2 rounded-full hover:bg-neutral-100">
            <!-- bag icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 7a4 4 0 118 0h3a1 1 0 011 1v11a2 2 0 01-2 2H6a2 2 0 01-2-2V8a1 1 0 011-1h3zm2 0a2 2 0 104 0H10z"/></svg>
          </a>
        </div>
      </div>
    </header>

    {% block body %}{% endblock %}

    <footer class="border-t border-neutral-200 mt-24">
      <div class="container mx-auto px-4 py-10 text-sm text-neutral-600">
        © {{ now|date:"Y" }} Clothify — All rights reserved.
      </div>
    </footer>
  </body>
</html>
